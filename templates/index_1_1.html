<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THRIFTORIA STORE</title><style>body{font-family:sans-serif;max-width:1000px;margin:auto;padding:20px} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px} .card{border:1px solid #ddd;border-radius:12px;padding:14px} .btn{background:#111;color:#fff;padding:8px 14px;border-radius:8px;text-decoration:none;border:0;cursor:pointer} .filter{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}</style></head>
<body><h1>THRIFTORIA.STORE</h1><p>INDONESIA STREETWEAR</p><p><a href="/admin">Admin Login</a> | <a href="/analyst">Data Analyst</a></p>
<form class="filter" method="get"><select name="kategori"><option value="">Semua Kategori</option>{% for k in kategoris %}<option value="{{k}}" {% if kategori_filter==k %}selected{% endif %}>{{k}}</option>{% endfor %}</select><select name="lengan"><option value="">Semua Lengan</option>{% for l in lengans %}<option value="{{l}}" {% if lengan_filter==l %}selected{% endif %}>{{l}}</option>{% endfor %}</select><button class="btn">Filter</button><a href="/">Reset</a></form>
<div class="grid">{% for p in products %}<div class="card"><h3>{{p.nama}}</h3><p>{{p.kategori}} • {{p.lengan}}</p><p><b>Rp {{ "{:,}".format(p.harga) }}</b> • Stok {{p.stok}}</p><p>{{p.deskripsi}}</p><form method="post" action="/beli/{{p.id}}"><input name="nama_pembeli" placeholder="Nama kamu" required><input type="number" name="qty" value="1" min="1" max="{{p.stok}}" style="width:60px"><button class="btn">Beli</button></form></div>{% endfor %}</div></body></html>

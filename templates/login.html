<!DOCTYPE html><html><head><meta charset="utf-8"><title>Admin Login - THRIFTORIA</title><style>
:root{--bg:#FFF6EC;--card:#FFFFFF;--ink:#2B2118;--muted:#7A6A5E;--accent:#C96F4A;--accent2:#7A9A7E;--soft:#FCE8D8;--line:#EADBCB}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
a{color:var(--accent)} .wrap{max-width:1080px;margin:auto;padding:22px 18px 60px}
header{background:linear-gradient(135deg,#FFF6EC 0%,#FCE8D8 55%,#DCE8D8 100%);border:1px solid var(--line);border-radius:20px;padding:22px 22px 18px}
h1{margin:0;font-size:34px;letter-spacing:-.5px} .tag{margin:6px 0 0;color:var(--muted);font-weight:600;letter-spacing:1.5px;font-size:13px}
.topnav{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px} .pill{background:#fff;border:1px solid var(--line);padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:600}
.pill.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.filter{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0} select,input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)} .btn{background:var(--accent);color:#fff;padding:10px 16px;border-radius:10px;border:0;cursor:pointer;font-weight:700} .btn.sage{background:var(--accent2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px} .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 6px 20px rgba(43,33,24,.06)} .card h3{margin:0 0 6px;font-size:18px} .price{font-size:18px;font-weight:800} .badge{display:inline-block;background:var(--soft);color:#8A4A2E;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700} .badge.sage{background:#E2EEE2;color:#3E5A41}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden} td,th{border-bottom:1px solid #F0E2D2;padding:10px;text-align:left} th{background:#FFF1E0}
.kpi{display:flex;gap:14px;flex-wrap:wrap} .kpi div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;flex:1;min-width:180px}
 .box{max-width:420px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px}</style></head><body><div class="wrap"><div class="box"><h2>Login — THRIFTORIA</h2>{% with m=get_flashed_messages() %}{% if m %}<p style="color:#B42318">{{m[0]}}</p>{% endif %}{% endwith %}<form method="post"><input name="username" placeholder="Username" style="width:100%;margin:8px 0"><input type="password" name="password" placeholder="Password" style="width:100%;margin:8px 0"><button class="btn" style="width:100%">Login</button></form><p><a href="/">← Kembali ke toko</a></p></div></div></body></html>

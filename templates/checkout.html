<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bayar QRIS - THRIFTORIA HOLOGRAM</title><style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0A0A14;color:#EDEDF5} .wrap{max-width:620px;margin:auto;padding:20px} .card{background:#151528;border:1px solid rgba(255,255,255,.2);padding:22px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))} .qris{background:#fff;color:#000;padding:16px;text-align:center} .timer{font-size:28px;font-weight:900;color:#FF00E5} .btn{background:linear-gradient(90deg,#00F0FF,#FF00E5);color:#fff;padding:12px 16px;border:0;font-weight:800;cursor:pointer;width:100%} .btn.sage{background:linear-gradient(90deg,#00FF88,#00F0FF);color:#000}
.skeleton{background:linear-gradient(90deg,#1A1A2E 25%,#2A2A45 37%,#1A1A2E 63%);background-size:400% 100%;animation:skeletonLoad 1.2s infinite} @keyframes skeletonLoad{0%{background-position:100% 0}100%{background-position:0 0}} .skel-line{height:14px;margin:8px 0} .skel-img{height:240px;width:240px;margin:auto}
</style></head><body><div class="wrap"><h1 style="background:linear-gradient(90deg,#00F0FF,#FF00E5,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent">CHECKOUT - THRIFTORIA</h1><p>INDONESIA STREETWEAR • 1 Transaksi = 1 QRIS = 1 Kunci</p><div class="card" id="box"><div class="skeleton skel-img"></div><div class="skeleton skel-line"></div><div class="skeleton skel-line" style="width:60%"></div><p style="text-align:center;color:#aaa">Memuat QRIS... (skeleton, bukan loading bulet)</p></div><p><a href="/" style="color:#00F0FF">Kembali ke toko</a></p></div>
<script>
let oid = new URLSearchParams(location.search).get('order_id'); let seconds=600;
async function load(){ let r=await fetch('/api/order/'+oid); let d=await r.json(); if(d.error){document.getElementById('box').innerHTML='<p>Order tidak ditemukan</p>'; return;} let items=d.orders.map(o=>`<p>${o.produk_nama} x ${o.qty} = Rp ${o.total.toLocaleString('id-ID')} • ${o.status}</p>`).join(''); let qrisUrl='https://api.qrserver.com/v1/create-qr-code/?size=260x260&data='+encodeURIComponent('THRIFTORIA|'+oid+'|TOTAL:'+d.total); document.getElementById('box').innerHTML=`<p><b>Order ID:</b> ${oid} <span style="background:#FF00E5;padding:4px 8px;font-weight:800">TERKUNCI</span></p><p><b>Status:</b> ${d.status}</p><hr>${items}<hr><p><b>Total harus pas:</b></p><h2 style="color:#00F0FF">Rp ${d.total.toLocaleString('id-ID')}</h2><p>Sisa kunci stok: <span class="timer" id="timer">10:00</span></p><div class="qris"><img src="${qrisUrl}" style="width:240px;height:240px"><p><b>SCAN QRIS INI</b></p><p style="font-size:12px;color:#555">QR ini hanya untuk order ${oid}. Jangan bayar 2x.</p></div><p style="font-size:13px;color:#aaa">Buka GoPay / OVO / DANA / OCTO Mobile - Scan QRIS - Bayar pas - Klik Saya Sudah Bayar.</p><button class="btn" onclick="confirmPay()">SAYA SUDAH BAYAR</button><button class="btn sage" style="margin-top:10px" onclick="location.reload()">CEK STATUS</button><p id="msg"></p>`; }
async function confirmPay(){ let r=await fetch('/api/confirm-payment/'+oid,{method:'POST'}); let d=await r.json(); document.getElementById('msg').innerHTML='<b style="color:#00FF88">Pembayaran dikonfirmasi! Order LUNAS. Screenshot ini sebagai nota.</b>'; setTimeout(()=>location.reload(),1200); }
setInterval(()=>{ if(seconds<=0) return; seconds--; let m=Math.floor(seconds/60), s=seconds%60; let el=document.getElementById('timer'); if(el) el.innerText=m+':'+String(s).padStart(2,'0'); },1000);
load();
</script></body></html>

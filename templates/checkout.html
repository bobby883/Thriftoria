<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bayar QRIS - THRIFTORIA</title><style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#FFF6EC;color:#2B2118} .wrap{max-width:620px;margin:auto;padding:20px} .card{background:#fff;border:1px solid #EADBCB;border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.08)} .qris{background:#fff;border:2px dashed #C96F4A;border-radius:16px;padding:16px;text-align:center} .timer{font-size:28px;font-weight:900;color:#B42318} .btn{background:#C96F4A;color:#fff;padding:12px 16px;border-radius:10px;border:0;font-weight:800;cursor:pointer;width:100%} .btn.sage{background:#7A9A7E}
</style></head><body><div class="wrap"><h1>🧾 Checkout — THRIFTORIA</h1><p>INDONESIA STREETWEAR • 1 Transaksi = 1 QRIS = 1 Kunci Pembayaran</p><div class="card" id="box"><p>Loading order...</p></div><p><a href="/">← Kembali ke toko</a></p></div>
<script>
let oid = new URLSearchParams(location.search).get('order_id');
let seconds = 600; // 10 menit kunci
async function load(){
  let r = await fetch('/api/order/'+oid); let d = await r.json();
  if(d.error){document.getElementById('box').innerHTML='<p>Order tidak ditemukan</p>'; return;}
  let items = d.orders.map(o=>`<p>${o.produk_nama} x ${o.qty} = Rp ${o.total.toLocaleString('id-ID')} • ${o.status}</p>`).join('');
  let qrisUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=' + encodeURIComponent('THRIFTORIA|'+oid+'|TOTAL:'+d.total);
  document.getElementById('box').innerHTML = `
    <p><b>Order ID:</b> ${oid} <span style="background:#FCE8D8;padding:4px 10px;border-radius:999px;font-weight:800">TERKUNCI</span></p>
    <p><b>Status:</b> ${d.status}</p><hr>${items}<hr>
    <p><b>Total yang harus dibayar (pas, jangan kurang/lebih):</b></p><h2>Rp ${d.total.toLocaleString('id-ID')}</h2>
    <p>Sisa waktu kunci stok: <span class="timer" id="timer">10:00</span></p>
    <div class="qris"><img src="${qrisUrl}" style="width:240px;height:240px"><p><b>SCAN QRIS INI</b></p><p style="font-size:12px;color:#7A6A5E">QR ini hanya untuk order ${oid}. Jangan bayar 2x untuk order yang sama. Kalau sudah bayar, klik tombol di bawah.</p></div>
    <p style="font-size:13px;color:#7A6A5E">Cara bayar: Buka GoPay / OVO / DANA / m-Banking → Scan QRIS → Bayar Rp ${d.total.toLocaleString('id-ID')} pas → Klik Saya Sudah Bayar.</p>
    <button class="btn" onclick="confirmPay()">Saya Sudah Bayar ✅</button>
    <button class="btn sage" style="margin-top:10px" onclick="location.reload()">Cek Status</button>
    <p id="msg"></p>`;
}
async function confirmPay(){
  let r = await fetch('/api/confirm-payment/'+oid, {method:'POST'}); let d = await r.json();
  document.getElementById('msg').innerHTML = '<b style="color:green">Pembayaran dikonfirmasi! Terima kasih, order kamu LUNAS. Screenshot halaman ini sebagai nota.</b>';
  setTimeout(()=>location.reload(), 1200);
}
setInterval(()=>{ if(seconds<=0) return; seconds--; let m=Math.floor(seconds/60), s=seconds%60; let el=document.getElementById('timer'); if(el) el.innerText = m+':'+String(s).padStart(2,'0'); }, 1000);
load();
</script></body></html>

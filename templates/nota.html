<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nota - THRIFTORIA</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;background:#FDF3E7;color:#2B2118}.wrap{max-width:620px;margin:auto;padding:20px}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 30px rgba(43,33,24,.08)}.btn{background:#2B2118;color:#fff;padding:12px 16px;border-radius:14px;border:0;font-weight:800;cursor:pointer;width:100%}</style></head><body><div class="wrap"><h1>Nota — THRIFTORIA</h1><div class="card" id="box"><p>Memuat nota...</p></div><p><a href="/" style="color:#2B2118">Kembali ke toko</a></p></div>
<script>
let oid=new URLSearchParams(location.search).get('order_id')||'{{order_id}}';
let serverOrders={{orders|tojson if orders is defined else '[]'}};
let serverTotal={{total|tojson if total is defined else 'null'}};
async function load(){
  let box=document.getElementById('box');
  let orders=serverOrders, total=serverTotal, status='{{status}}', nama='{{nama_pembeli}}';
  if(!orders || !orders.length){
    // Fallback HP: server /tmp ke-reset -> nota dari snapshot
    try{ let s=JSON.parse(localStorage.getItem('thriftoria_last_order')||'null'); if(s && s.order_id===oid){ orders=s.orders||[]; total=s.total; status=s.status; nama=s.nama; box.innerHTML='<p style="background:#FFF3D6;padding:10px;border-radius:12px;font-size:13px">Nota dari data HP kamu (server Vercel ke-reset). Screenshot nota ini + kirim ke admin via WA ya.</p>'+render(orders,total,status,nama); return; } }catch(_){}
    box.innerHTML='<p><b>Nota tidak ketemu di server.</b></p><p style="font-size:13px;color:#6B5A4A">Order '+oid+' tidak ada di server (Vercel ke-reset / habis Redeploy). Kalau kamu sudah bayar, screenshot halaman ini + kirim bukti bayar ke admin via WA.</p><button class="btn" onclick="location.href=\'/\'">KEMBALI KE TOKO</button>';
    return;
  }
  box.innerHTML=render(orders,total,status,nama);
}
function render(orders,total,status,nama){
  let items=orders.map(o=>'<p>'+o.produk_nama+' x '+o.qty+' = Rp '+(o.total||0).toLocaleString('id-ID')+' • '+o.status+'</p>').join('');
  let ongkir=0; try{ let s=JSON.parse(localStorage.getItem('thriftoria_last_order')||'null'); if(s&&s.order_id===oid) ongkir=s.ongkir||0; }catch(_){}
  return '<p><b>Order ID:</b> '+oid+'</p><p><b>Pembeli:</b> '+nama+'</p><p><b>Status:</b> '+status+'</p><hr>'+items+'<hr><p>Ongkir: Rp '+ongkir.toLocaleString('id-ID')+'</p><h2>Total: Rp '+(total||0).toLocaleString('id-ID')+'</h2><p style="font-size:13px;color:#6B5A4A">Terima kasih sudah belanja di THRIFTORIA! Screenshot nota ini sebagai bukti.</p><button class="btn" onclick="window.print()">SIMPAN / SCREENSHOT NOTA</button>';
}
load();
</script></body></html>
